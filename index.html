<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('brain-up-theme');
          const theme = saved === 'dark' || saved === 'light' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
        } catch {
          document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
      })();
    </script>
    <title>Brain Up Labs</title>
    <meta name="description" content="Empowering 500+ schools across India with turnkey STEM, Robotics, and AI innovation labs, modular Labs on Table™ systems, aligned K-12 curricula, and teacher certification." />

    <meta property="og:description" content="Empowering 500+ schools across India with turnkey STEM, Robotics, and AI innovation labs, modular Labs on Table™ systems, aligned K-12 curricula, and teacher certification." />
